name: Beacon
options:
  bundleIdPrefix: com.beacon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Beacon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Beacon
        excludes:
          - "**/.DS_Store"
          - "Secrets.example.plist"
    resources:
      - Beacon/Assets.xcassets
      - path: Beacon/Secrets.plist
        optional: true
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
          - en
        CFBundleDisplayName: Beacon
        NSCameraUsageDescription: ביקון משתמשת במצלמה כדי לצלם מסמכים רפואיים, קופסאות תרופות ומכתבי זימון.
        # Without UILaunchScreen iOS runs the app in legacy compatibility
        # mode: it letterboxes every screen with black bars top and bottom.
        # These belong here rather than in Info.plist directly — xcodegen
        # regenerates that file and would drop them. The INFOPLIST_KEY_*
        # build settings below are inert because GENERATE_INFOPLIST_FILE is NO.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beacon.app
        INFOPLIST_FILE: Beacon/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # Push Notifications entitlement (Beacon/Beacon.entitlements) is
        # deliberately NOT wired in here. A free "Personal Team" Apple ID
        # cannot provision that capability at all — Xcode's automatic
        # signing fails outright with it present. Re-add
        # `CODE_SIGN_ENTITLEMENTS: Beacon/Beacon.entitlements` once a paid
        # Apple Developer Program membership is active (see
        # docs/push_notifications.md) so a personal, unpaid device install
        # keeps working until then.
