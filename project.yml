name: Beacon
options:
  bundleIdPrefix: com.beacon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Beacon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Beacon
        excludes:
          - "**/.DS_Store"
          - "Secrets.example.plist"
    resources:
      - Beacon/Assets.xcassets
      - path: Beacon/Secrets.plist
        optional: true
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
          - en
        CFBundleDisplayName: Beacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beacon.app
        INFOPLIST_FILE: Beacon/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
