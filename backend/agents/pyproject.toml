[project]
name = "beacon-agents"
version = "0.1.0"
description = "Beacon — Operational AI agents + CEO dashboard (separated from user-facing API)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "streamlit>=1.36",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx[http2]>=0.27",
    "beacon-shared",
]

[tool.ruff]
line-length = 100
target-version = "py311"
