[project]
name = "beacon-shared"
version = "0.1.0"
description = "Beacon — shared DB models, schemas, migrations"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pgvector>=0.3",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = [".."]
include = ["shared*"]
